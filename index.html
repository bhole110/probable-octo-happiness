  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;

      font-family: "Inter", sans-serif;
      color: #fff;
      text-align: center;

      background:
        radial-gradient(circle at 50% 15%, rgba(255, 72, 72, 0.14), transparent 34%),
        radial-gradient(circle at 90% 90%, rgba(255, 145, 0, 0.10), transparent 30%),
        #080808;
    }

    .wrapper {
      width: 100%;
      max-width: 390px;
    }

    .logo {
      position: relative;
      display: inline-block;
      margin-bottom: 30px;

      font-size: clamp(1.65rem, 7vw, 2.1rem);
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.2;

      color: #fff;
      text-shadow:
        0 0 18px rgba(255, 70, 70, 0.25);
    }

    .logo::after {
      content: "";
      display: block;
      width: 55px;
      height: 3px;
      margin: 11px auto 0;

      border-radius: 10px;
      background: linear-gradient(90deg, #ff3b30, #ff9500);
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 60px;
      padding: 16px 22px;

      border-radius: 14px;
      border: 1px solid rgba(255, 105, 75, 0.45);

      background:
        linear-gradient(
          135deg,
          rgba(255, 59, 48, 0.95),
          rgba(255, 107, 45, 0.95)
        );

      color: #fff;
      text-decoration: none;
      font-size: 1.04rem;
      font-weight: 800;
      letter-spacing: 0.4px;

      box-shadow:
        0 10px 28px rgba(255, 59, 48, 0.22),
        inset 0 1px 0 rgba(255,255,255,0.25);

      overflow: hidden;
      transition: 0.2s ease;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;

      width: 60%;
      height: 100%;

      background: linear-gradient(
        100deg,
        transparent,
        rgba(255,255,255,0.32),
        transparent
      );

      transform: skewX(-22deg);
      animation: buttonShine 3s infinite;
    }

    .btn span {
      position: relative;
      z-index: 2;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 14px 34px rgba(255, 59, 48, 0.32),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .btn:active {
      transform: scale(0.98);
    }

    @keyframes buttonShine {
      0% {
        left: -100%;
      }

      45%, 100% {
        left: 150%;
      }
    }

    .footer {
      margin-top: 25px;

      color: #5f5f5f;
      font-size: 0.7rem;
      font-weight: 500;
      line-height: 1.5;
    }

    @media (max-width: 380px) {
      .logo {
        font-size: 1.55rem;
      }

      .btn {
        min-height: 56px;
        font-size: 0.98rem;
      }
    }
  </style>
